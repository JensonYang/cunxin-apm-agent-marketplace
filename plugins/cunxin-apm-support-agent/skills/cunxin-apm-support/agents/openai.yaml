interface:
  display_name: "Cunxin APM Support"
  short_description: "Diagnose Cunxin printer customer complaints from APM telemetry."
  default_prompt: "Analyze a Cunxin printer customer complaint from APM logs or a Zentao Bug URL. For a Zentao link, first run scripts/ensure_zentao_debug.py --ensure; when it performs the first installation, ask the user to reopen the chat and resend the link, otherwise use the zentao-debug MCP skill. When a local cn-saas-printer checkout exists, use its origin/dev code to validate the suspected execution path without changing the checkout. Ask for a user or print ID and an exact Shanghai date only when bounded APM correlation is needed."
